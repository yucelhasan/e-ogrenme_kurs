{% extends 'base.html' %}
{% block title %}Duyuru Yap - {{ course.title }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-secondary text-white py-3">
                    <h5 class="mb-0 fw-bold"><i class="fa-solid fa-bullhorn me-2"></i>Yeni Duyuru Yayınla</h5>
                </div>
                <div class="card-body p-4">
                    <div class="alert alert-info border-0 shadow-sm mb-4">
                        <i class="fa-solid fa-circle-info me-2"></i><strong>{{ course.title }}</strong> kursuna kayıtlı olan tüm öğrenciler bu duyuruyu görebilecektir.
                    </div>
                    
                    <form method="POST">
                        {% csrf_token %}
                        <!-- Form alanlarını buraya basıyoruz -->
                        {{ form.as_p }}
                        
                        <div class="d-flex justify-content-end mt-4">
                            <a href="{% url 'manage_curriculum' course.id %}" class="btn btn-light fw-bold me-2 shadow-sm">İptal</a>
                            <button type="submit" class="btn btn-secondary fw-bold shadow-sm">
                                <i class="fa-solid fa-paper-plane me-1"></i> Yayınla
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
